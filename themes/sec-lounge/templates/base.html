<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
  <meta charset="utf-8">
  <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/main.css">
  <link rel="icon" href="{{ SITEURL }}/favicon.svg" type="image/svg+xml">
</head>
<body>
  <header>
    <h1><a href="{{ SITEURL }}/">{{ SITENAME }}</a></h1>
    <nav>
      <a href="{{ SITEURL }}/">[ >_ HOME ]</a> |
      <a href="{{ SITEURL }}/category/writeups/">[ WRITEUPS ]</a> |
      <a href="{{ SITEURL }}/category/experimentos/">[ EXPERIMENTOS ]</a> |
      <a href="{{ SITEURL }}/category/offtopic/">[ OFFTOPIC ]</a> |
      <a href="{{ SITEURL }}/sobre/">[ SOBRE ]</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <div class="terminal-area">
      <div id="terminal-output"></div>
    </div>
    <div class="footer-right">
      <span class="signature">// [security_lounge] by pedro //</span>
    </div>

    <script>
    (function () {
      const output = document.getElementById('terminal-output');

      let radioAudio = null;
      let radioPlaying = false;
      const RADIO_STREAM = 'https://streams.ilovemusic.de/iloveradio17.mp3';
      const RADIO_NAME = 'ilovemusic — lofi chill radio';

      function startRadio() {
        if (!radioAudio) { radioAudio = new Audio(RADIO_STREAM); radioAudio.volume = 0.4; }
        radioAudio.play().catch(() => null);
        radioPlaying = true;
      }
      function stopRadio() {
        if (radioAudio) { radioAudio.pause(); radioAudio.currentTime = 0; }
        radioPlaying = false;
      }

      const COMMANDS = {
        help: () => [
          '<span class="t-ok">comandos disponíveis:</span>',
          '  <span class="t-cmd">ls --notes</span>        notas em andamento',
          '  <span class="t-cmd">open --repo</span>        abre o repositório no GitHub',
          '  <span class="t-cmd">radio --play</span>       inicia rádio lofi',
          '  <span class="t-cmd">radio --stop</span>       para a rádio',
          '  <span class="t-cmd">radio --status</span>     status da rádio',
          '  <span class="t-cmd">whoami</span>             sobre o autor',
          '  <span class="t-cmd">clear</span>              limpa o terminal',
        ].join('\n'),

        'ls --notes': () => {
          fetch('wip.txt')
            .then(r => {
              if (!r.ok) throw new Error();
              return r.text();
            })
            .then(text => {
              const lines = text.split('\n').filter(l => l.trim());
              const div = document.createElement('div');
              div.className = 't-line';
              if (lines.length === 0) {
                div.innerHTML = '<span class="t-warn">nenhuma nota em andamento no momento.</span>';
              } else {
                div.innerHTML = '<span class="t-ok">~/vault/wip/</span>\n' +
                  lines.map(l => '  ' + escapeHtml(l)).join('\n');
              }
              output.insertBefore(div, activePromptLine);
            })
            .catch(() => {
              const div = document.createElement('div');
              div.className = 't-line';
              div.innerHTML = '<span class="t-err">erro ao ler wip.txt</span>';
              output.insertBefore(div, activePromptLine);
            });
          return null;
        },

        'open --repo': () => {
          window.open('https://github.com/lovepxdro/sec-lounge', '_blank');
          return '<span class="t-ok">abrindo repositório...</span>';
        },

        'radio --play': () => {
          if (radioPlaying) return '<span class="t-warn">rádio já está tocando.</span>';
          startRadio();
          return '<span class="t-ok">♫ ' + RADIO_NAME + '</span>';
        },

        'radio --stop': () => {
          if (!radioPlaying) return '<span class="t-warn">rádio não está tocando.</span>';
          stopRadio();
          return '<span class="t-ok">♫ rádio pausada.</span>';
        },

        'radio --status': () => radioPlaying
          ? '<span class="t-ok">♫ tocando — ' + RADIO_NAME + '</span>'
          : '<span class="t-warn">♫ parada.</span>',

        whoami: () => '<span class="t-ok">pedro</span> (aka pedro)',

        'cat.sh': () => [
          '<span class="t-ok"> /\\_/\\  </span>',
          '<span class="t-ok">( o.o ) </span>',
          '<span class="t-ok"> > ^ <  </span>',
          '<span class="t-label"> meow  </span>',
        ].join('\n'),

        clear: () => null,
      };

      function escapeHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      function printLine(html) {
        html.split('\n').forEach(function(line) {
          const div = document.createElement('div');
          div.className = 't-line';
          div.innerHTML = line;
          output.appendChild(div);
        });
      }

      let activePromptLine = null;
      let activeInput = null;
      const cmdHistory = [];
      let histIdx = -1;

      function handleKey(e) {
        if (e.key === 'Enter') {
          const cmd = activeInput.value.trim();
          cmdHistory.unshift(activeInput.value);
          histIdx = -1;

          const frozen = document.createElement('div');
          frozen.className = 't-line';
          frozen.innerHTML =
            '<span class="t-prompt">[security_lounge@term:~]$</span> ' +
            escapeHtml(activeInput.value);
          activePromptLine.replaceWith(frozen);
          activePromptLine = null;
          activeInput = null;

          if (cmd === 'clear') {
            output.innerHTML = '';
          } else if (cmd) {
            const result = COMMANDS[cmd]
              ? COMMANDS[cmd]()
              : '<span class="t-err">command not found: ' + escapeHtml(cmd) + ' — tente <span class="t-cmd">help</span></span>';
            if (result) printLine(result);
          }

          createPromptLine();
          activeInput.focus();

        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (histIdx < cmdHistory.length - 1) histIdx++;
          activeInput.value = cmdHistory[histIdx] || '';
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          histIdx = histIdx > 0 ? histIdx - 1 : -1;
          activeInput.value = histIdx >= 0 ? cmdHistory[histIdx] : '';
        }
      }

      function createPromptLine() {
        activePromptLine = document.createElement('div');
        activePromptLine.className = 't-line terminal-input-line';
        activePromptLine.innerHTML =
          '<span class="t-prompt">[security_lounge@term:~]$</span> ';

        activeInput = document.createElement('input');
        activeInput.type = 'text';
        activeInput.autocomplete = 'off';
        activeInput.spellcheck = false;
        activeInput.setAttribute('aria-label', 'terminal input');
        activeInput.addEventListener('keydown', handleKey);

        activePromptLine.appendChild(activeInput);
        output.appendChild(activePromptLine);
      }

      document.querySelector('footer').addEventListener('click', () => {
        if (activeInput) activeInput.focus();
      });

      createPromptLine();
    })();
    </script>
  </footer>
</body>
</html>
