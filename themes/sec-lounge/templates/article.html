{% extends "base.html" %}

{% block title %}{{ article.title }} - {{ SITENAME }}{% endblock %}

{% block content %}
  <article>
    <header class="article-header">
      <p class="meta"><time>{{ article.locale_date }}</time> | <span>#{{ article.category }}</span></p>
    </header>
    <div class="content">
      {{ article.content }}
    </div>
  </article>
{% endblock %}
